<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Redirecting…</title>

  <!-- Tell search engines the canonical URL is the site root -->
  <link rel="canonical" href="https://vireo-solar.de/">

  <!-- HTML meta-refresh redirect to the real app (fallback where server redirects are not available).
       This is more SEO-friendly than a JavaScript-only redirect. -->
  <meta http-equiv="refresh" content="0;url=/SolarPanel/index.html">
</head>
<body>
  <p>Redirecting to <a href="/SolarPanel/index.html">the site</a>. If you are not redirected, click the link.</p>
</body>
</html>
